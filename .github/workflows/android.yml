name: Android APK

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/platforms/android-35
            /usr/local/lib/android/sdk/build-tools/35.0.0
          key: android-sdk-35-v1

      - name: Install Android SDK packages
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -n "$SDKM"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Read version
        id: version
        run: |
          VERSION=$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d '\r')
          CODE=$(grep '^versionCode=' version.properties | cut -d= -f2 | tr -d '\r')
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches version
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: |
          EXPECTED="android-v${{ steps.version.outputs.name }}"
          if [ "$EXPECTED" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version.properties ($EXPECTED)" >&2
            exit 1
          fi

      - name: Verify versionCode and versionName
        run: |
          CODE="${{ steps.version.outputs.code }}"
          NAME="${{ steps.version.outputs.name }}"
          case "$CODE" in
            ''|*[!0-9]*) echo "versionCode must be a positive integer, got '$CODE'" >&2; exit 1 ;;
          esac
          if [ "$CODE" -le 0 ]; then
            echo "versionCode must be positive" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != refs/tags/android-v* ]]; then
            exit 0
          fi
          LATEST_TAG=$(curl -fsSL "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("tag_name", ""))' || true)
          if [ -z "$LATEST_TAG" ]; then
            echo "No previous release found; skip comparison"
            exit 0
          fi
          LATEST="${LATEST_TAG#android-v}"
          if [ "$LATEST" = "$NAME" ] || [ "$(printf '%s\n%s\n' "$LATEST" "$NAME" | sort -V | tail -n1)" != "$NAME" ]; then
            echo "versionName $NAME must be greater than latest release $LATEST" >&2
            exit 1
          fi

      - name: Build APK
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Building signed release"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore
            export ANDROID_KEYSTORE_PATH=release.keystore
            gradle --no-daemon assembleRelease
            APK=app/build/outputs/apk/release/app-release.apk
            SUFFIX=""
          elif [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            echo "Signing secrets are required for an APK release" >&2
            exit 1
          else
            echo "No signing secrets: building debug APK"
            gradle --no-daemon assembleDebug
            APK=app/build/outputs/apk/debug/app-debug.apk
            SUFFIX="-debug"
          fi
          test -f "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools/35.0.0" -name aapt2 -type f | head -n 1)
          test -n "$AAPT"
          BADGING=$("$AAPT" dump badging "$APK" | head -n 1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionCode='${{ steps.version.outputs.code }}'" \
            || { echo "APK versionCode does not match version.properties" >&2; exit 1; }
          echo "$BADGING" | grep -q "versionName='${{ steps.version.outputs.name }}'" \
            || { echo "APK versionName does not match version.properties" >&2; exit 1; }
          NAME="midipult-android-${{ steps.version.outputs.name }}${SUFFIX}.apk"
          cp "$APK" "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: midipult-android
          path: |
            midipult-android-*.apk
            midipult-android-*.apk.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MidiPult Android ${{ steps.version.outputs.name }}
          body: |
            Android-оболочка MidiPult ${{ steps.version.outputs.name }}.
            Панель загружается с вашей станции; обновления панели не требуют
            пересборки APK.
          files: |
            midipult-android-${{ steps.version.outputs.name }}.apk
            midipult-android-${{ steps.version.outputs.name }}.apk.sha256
